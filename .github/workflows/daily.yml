# Collect top list and store details (daily): runs collect.py and saves what it collected on the "data" branch, so data never mixes with code.
name: Collect top list and store details (daily)

on:
  schedule:
    - cron: "45 1 * * *"       # a backup only: cron-job.org starts the real run at 00:15 UTC. GitHub may start this
                               # one hours late, so it runs only if today's store file is missing (--if-missing)
  workflow_dispatch:          # a "Run workflow" button on the Actions tab

permissions:
  contents: write             # to push to the data branch

concurrency:
  group: data-branch          # the hourly and daily jobs never write the data branch at the same time
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: store
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      # A run with too many failed games still saves what it got; it is marked failed only at the end.
      - name: Collect
        id: collect
        run: |
          backup=""; if [ "${{ github.event_name }}" = "schedule" ]; then backup="--if-missing"; fi
          python collect.py daily --out store $backup || echo "failed=true" >> "$GITHUB_OUTPUT"
      - name: Save to the data branch
        id: save
        working-directory: store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -q -m "daily: $(date -u +%Y-%m-%dT%H:%MZ)"
          for try in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
      # If the push failed three times, the files would vanish with the runner: keep them as a download for 7 days.
      - name: Keep the files if they could not be saved
        if: failure() && steps.save.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unsaved-raw-files
          path: store/raw
          retention-days: 7
      - name: Fail the run if the collection failed
        if: steps.collect.outputs.failed == 'true'
        run: exit 1
