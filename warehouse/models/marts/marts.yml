version: 2

models:
- name: dim_games
  description: One row per game ever tracked, with its latest store details.
  columns:
  - name: appid
    data_tests: [unique, not_null]
  - name: name
    data_tests: [not_null]
- name: fct_game_daily
  description: One row per game per UTC day - players, price, discount and rank. Suspicious zeros are left out of
    peak_players and avg_players.
  columns:
  - name: appid
    data_tests:
    - not_null
    - relationships:
        arguments: {to: ref('dim_games'), field: appid}
  - name: hours_collected
    data_tests:
    - between:
        arguments: {min_value: 1, max_value: 24}
  - name: on_sale
    description: True when discounted, false at full price, NULL when there was no store answer that day (unknown).
  - name: has_store_data
    data_tests: [not_null]
  - name: full_day
    description: At least 20 usable hourly counts. Compare players across days only on full days.
    data_tests: [not_null]
  data_tests:
  - unique_combination:
      arguments:
        columns: [appid, collected_on]
- name: collection_coverage
  description: One row per finished UTC day since collection began (a calendar, so a day with no run is 0%) - how
    many hourly runs and store runs were captured. valid_coverage_pct also leaves out suspicious zeros.
  columns:
  - name: collected_on
    data_tests: [unique, not_null]
  - name: coverage_pct
    description: Hourly runs captured as a percentage of the hours expected. Below 90 is a warning, not an error
      - a missed hour is lost for good, but the rest of the day is still good data.
    data_tests:
    - between:
        arguments: {min_value: 90, max_value: 100}
        config: {severity: warn}
- name: dashboard_game_daily
  description: One row per game per UTC day with names and genres, for Looker Studio.
  data_tests:
  - unique_combination:
      arguments:
        columns: [appid, collected_on]
  columns:
  - name: players_vs_baseline_pct
    description: The day's average players against the game's own average on full days without a discount, in %.
  - name: discount_band
    data_tests:
    - accepted_values:
        arguments:
          values: ['0%', '1-24%', '25-49%', '50-74%', '75%+']
  - name: name
    data_tests: [not_null]
